[package]
name = "excel"
version = "0.3"
edition = "2021"
rust-version = "1.81"
description = "通用 Excel 导入导出工具：流式读写（百万级）、动态表头适配、多 sheet、单元格图片、批量落库（纯 Rust，对标 EasyExcel）"
keywords = ["excel", "xlsx", "import", "export", "streaming"]
categories = ["parser-implementations", "file-format"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rust_decimal = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
async-trait = "0.1"
log = "0.4"
inventory = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# 直接在依赖处开启 constant_memory：保证本 crate 拿到流式写入能力
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
# flate2 保持本 crate 自包含（zip 解压 deflate）
flate2 = "1"
excel-macros = { path = "fast-excel-macros" }

[dev-dependencies]
base64 = "0.23"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }